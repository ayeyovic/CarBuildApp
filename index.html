<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Chasu Home Page</title>
</head>
<body>
    <div>
        <div class="TopRow">
            <h1>CHASU</h1>
            <input type="text" placeholder="Search builds, chassis, users">
            <button type="button">Search</button>
        </div>
        <div class="nav-bar">
            <ul>
                <li><a href="#">For You (Make drop down later to toggle for you and following)</a></li>
                <li><a href="#">Builds</a></li>
                <li><a href="#">Chassis</a></li>
                <li><a href="#">Users</a></li>
            </ul>
        </div>
        <div class="post">
            <div class="post-header">
                <div class="post-user-pfp">
                    <img src="images/user1.jpg" alt="User 1">
                </div>
                <div class="post-header-info">
                    <h3>Name</h3>
                    <p>Updated suspension + (hours ago / date)</p>
                </div>
                <div class="post-header-chassis">
                    <h3>Chassis</h3>
                </div>
            </div>
            <div class="post-images">
                <img src="images/engine1.jpg" alt="Post Image">
            </div>
            <div class="post-footer">
                <div class="post-footer-description">
                    <p>This is a description of the post. It can be a few sentences long and provide context for the images above.</p>
                </div>
                <div class="post-footer-actions">
                    <button type="button">Like</button>
                    <button type="button">Comment</button>
                    <button type="button">Share</button>
                </div>
            </div>
        </div>
    </div>
        
    
</body>
</html>
